fazhunt.animatronics.description.freddy=Kontrollálhatatlan dühöt képes érezni azokkal szemben akik "kempelnek" vagy tétlenek. \n\nFŐ KÉPESSÉG: 'Vak Düh' erőt ad neki hogy el tudja kapni aki "kempel" vagy tétlen. Amint elegendő düh halmozódik fel, az áldozat kijelölés-re kerül Freddy számára, és a sebessége drasztikusan megnő. Freddy nem üldözhet más játékosokat, amíg ki nem végzi az aktuális célpontott.
fazhunt.animatronics.description.bonnie=Amióta elvesztette az arcát, képes keresztűl látni másokon. \n\nFŐ KÉPESSÉG: 'Az enyém vagy'-al Bonnie képes a körülötte lévők közűl valakit észlelni a tereptárgyakon keresztűl.
fazhunt.animatronics.description.chica=Egy volt étel futár, aki most már fájdalom futár. \n\nFŐ KÉPESSÉG: 'Süti Csapda' lehetőséget adnak Chica-nák hogy hátra hadjon süteményeket, amik jelentősen lelassítják a játékost és jelzést adnak Chica-nák a játékos hol létéről.
fazhunt.animatronics.description.foxy=Magas mobilitással bír amivel azonnal az áldozatok mögé kerűl. \n\nFŐ KÉPESSÉG: 'Roham' fel gyorsítja Foxy-t 3mp ig. Hogy meghosszabítsd a rohamot ütköznie kell egy tereptárgyal időnbelűl. Az első tereptárgy ütközése után Foxy már tudja is támadni áldozatát!
fazhunt.animatronics.description.endo=Lassabb mindközűl de annál erősebb \n\nFŐ KÉPESSÉG: 'Vas marok' lehetőséget ad hogy meg fogja áldozatát és játszon vele. Tárgyak dobási ereje nagy mértékben megnő, ezzel lehetőséget kap hogy le üsse áldozatát magasabb helyekről!
fazhunt.animatronics.description.sfreddy=Senki sem tudja ha közelbe van! \n\nFŐ KÉPESSÉG: 'Süllyedés' Láthatatlanná teszi Árny Freddy-t és képes lesz át repűlni a falakon! Tökéletes hogy el áld az áldozataid útját és túl járj az eszükön.
fazhunt.animatronics.description.clown=Nem tudja hogy került ide, de még azt sem hogy miért így néz ki. \n\nAzonnali ölés helyett, ő egy kalapácsal támad áldozataira. Hogy effektíven tudja kergetni áldozatait, ugrás közben sebessége megnő rövid időre!
