fazhunt.animatronics.description.freddy=拥有对蹲守或闲置玩家感到无法控制的愤怒的能力。\n\n主要能力："盲目暴怒"让他能抓住躲藏或不动的玩家。积累足够怒气后，受害者会被高亮显示给弗莱迪，并且他的速度大幅提升。弗莱迪在对付当前目标前无法追击其他玩家。
fazhunt.animatronics.description.bonnie=曾失去面部，从而获得了看透他人内心的能力。\n\n主要能力："你的就是我的"允许邦尼控制当前视线内的目标；否则随机选择一名玩家。
fazhunt.animatronics.description.chica=前外卖员，现在专送痛苦。\n\n主要能力："地雷"允许奇卡在地图上放置蛋糕。这些蛋糕会暴露经过玩家的位置并短暂减慢其速度。
fazhunt.animatronics.description.foxy=高机动性使其易于追上受害者。\n\n主要能力："冲锋"使狐狸加速3秒。要延长冲锋时间，他必须在该时间内撞击任何障碍物。首次撞击墙壁后，狐狸能用钩子伤害受害者。
fazhunt.animatronics.description.endo=速度最慢，但力量最强。\n\n主要能力："钢铁之握"允许他抓住玩家并戏弄他们。他投掷道具的力量增强，能将受害者从高处击落。
fazhunt.animatronics.description.sfreddy=无人知晓他何时在附近。\n\n主要能力："潜入"使暗影弗莱迪隐形并赋予他穿墙飞行的能力。完美用于封锁路径和通过预测路线智取受害者。
fazhunt.animatronics.description.clown=他不知道为何在此，更不知为何如此打扮。\n\n不使用即死攻击，而是用锤子攻击受害者。为有效追击，他在跳跃时获得加速。

fazhunt.animatronics.description.springtrap=行走无声，几乎从不留逃生机会。\n\n主要能力："召唤"允许弹簧陷阱召唤同伴——小兔陷阱——持续一段时间。\n\n被动能力："执念"在弹簧陷阱积极追击玩家时积累。当"执念"计量表达到上限，弹簧陷阱获得加速并高亮显示他追击最多的幸存者。

fazhunt.animatronics.description.gfreddy=一个殉道儿童，被困于金色电子玩偶套装内，以鬼魂形态出现在受害者面前。\n\n找到任意幸存者并选择其为受害者。你的任务是吓唬受害者，突然出现在拐角或身后。\n\n受害者的目标是找到附近散落的所有毛绒玩具。若受害者收集全部玩具，他们将不再是你的目标。

fazhunt.animatronics.description.mangle=每个角落可能都不安全。\n\n主要能力："猛扑"允许蔓果从当前表面跃起并附着到新表面。从墙壁或天花板使用"猛扑"可对幸存者造成大量伤害。
fazhunt.animatronics.description.tchica=完全辅助型角色。\n\n主要能力："挟持"允许抓住附近幸存者，随后该幸存者的"执念"等级开始提升。\n\n共有3个执念等级。每有一个达到最大等级的幸存者，电子玩偶团队获得增益：\n- 1个执念者：全队获得5%移动速度提升，持续5秒；效果结束后，5秒后重复。\n- 2个执念者：电子玩偶倒地后的僵直时间减少20%。\n- 3个执念者：所有被执念幸存者附近，定期高亮附近幸存者给玩具奇卡；玩具奇卡获得奔跑能力。\n\n在累积满3个被执念幸存者前无法奔跑。可攻击被执念玩家。