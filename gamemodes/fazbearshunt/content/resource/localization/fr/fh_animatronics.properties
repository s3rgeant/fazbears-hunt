fazhunt.animatronics.description.freddy=Éprouve une rage incontrôlable envers les joueurs qui campent ou restent immobiles. \n\nCAPACITÉ PRINCIPALE : « Rage aveugle » lui permet d’attraper les joueurs cachés ou immobiles. Une fois suffisamment de rage accumulée, la victime est mise en surbrillance pour Freddy et sa vitesse augmente drastiquement. Freddy ne peut pas poursuivre d’autres joueurs tant qu’il n’a pas réglé le cas de sa cible actuelle.
fazhunt.animatronics.description.bonnie=Ayant un jour perdu son visage, il a gagné la capacité de voir à travers celui des autres. \n\nCAPACITÉ PRINCIPALE : « Ce qui est à toi est à moi » permet à Bonnie de voir les alentours d’une victime aléatoire lorsque la capacité est utilisée.
fazhunt.animatronics.description.chica=Ancienne livreuse de nourriture, elle livre désormais la douleur. \n\nCAPACITÉ PRINCIPALE : « Mine » permet à Chica de placer des cupcakes sur la carte. Ces cupcakes révèlent la position des joueurs qui passent et les ralentissent brièvement.
fazhunt.animatronics.description.foxy=Sa grande mobilité lui permet de rattraper facilement ses victimes. \n\nCAPACITÉ PRINCIPALE : « Charge » accélère Foxy pendant 3 secondes. Pour prolonger la Charge, il doit percuter un obstacle dans ce délai. Après le premier impact contre un mur, Foxy peut blesser la victime avec son crochet.
fazhunt.animatronics.description.endo=Le plus lent de tous, mais le plus puissant. \n\nCAPACITÉ PRINCIPALE : « Poigne d’acier » lui permet d’agripper un joueur et de s’amuser avec lui. Sa force de lancer d’objets est augmentée, ce qui lui permet de faire chuter des victimes de hautes corniches.
fazhunt.animatronics.description.sfreddy=Personne ne sait quand il est à proximité. \n\nCAPACITÉ PRINCIPALE : « Submersion » rend Shadow Freddy invisible et lui permet de traverser les murs en volant. Parfait pour bloquer des passages et déjouer les victimes en anticipant leurs trajectoires.
fazhunt.animatronics.description.clown=Il ne sait pas comment il est arrivé ici, et encore moins pourquoi il est habillé ainsi. \n\nAu lieu d’éliminations instantanées, il manie un marteau pour attaquer les victimes. Pour les poursuivre efficacement, il gagne de la vitesse en sautant.

fazhunt.animatronics.description.springtrap=Silencieux lorsqu’il marche, il laisse rarement une chance de s’échapper. \n\nCAPACITÉ PRINCIPALE : « Invocation » permet à Springtrap d’appeler son compagnon – Plushtrap – pendant une durée déterminée. \n\nCAPACITÉ PASSIVE : « Rage » se charge lorsque Springtrap poursuit activement des joueurs. Lorsque la jauge de Rage atteint son maximum, Springtrap gagne un bonus de vitesse et la mise en surbrillance du survivant qu’il a le plus pourchassé.

fazhunt.animatronics.description.gfreddy=Un enfant-martyr, piégé dans un costume d’animatronique doré, apparaît aux victimes comme un fantôme. \n\nTrouvez n’importe quel survivant et désignez-le comme votre victime. Votre tâche est d’effrayer la victime en surgissant au détour des couloirs ou juste derrière elle. \n\nL’objectif de la victime est de trouver toutes les peluches éparpillées à proximité. Si elle les collecte toutes, elle ne sera plus votre victime.

fazhunt.animatronics.description.mangle=Chaque coin peut être dangereux. \n\nCAPACITÉ PRINCIPALE : « Bond » permet à Mangle de se projeter depuis la surface actuelle et de s’agripper à une nouvelle. Utiliser « Bond » depuis un mur ou un plafond peut infliger de lourds dégâts à un survivant.