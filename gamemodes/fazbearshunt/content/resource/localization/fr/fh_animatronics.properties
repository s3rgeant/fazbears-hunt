fazhunt.animatronics.description.freddy=Entre dans une rage incontrôlable face aux joueurs qui campent ou restent immobiles. \n\nCAPACITÉ : "Rage aveugle" permet de traquer ceux qui ne bougent pas. Une fois la rage accumulée, la victime est révélée et Freddy gagne un boost de vitesse massif. Il ne peut pas chasser d'autres joueurs tant qu'il n'a pas éliminé sa cible.
fazhunt.animatronics.description.bonnie=Ayant jadis perdu son visage, il a appris à voir à travers celui des autres. \n\nCAPACITÉ : "Ce qui est à toi est à moi" permet de voir à travers les yeux de la cible visée (ou d'un joueur aléatoire).
fazhunt.animatronics.description.chica=Ancienne livreuse de pizzas, elle livre désormais la souffrance. \n\nCAPACITÉ : "Mine" permet de placer des cupcakes. Ils révèlent la position des joueurs proches et les ralentissent brièvement.
fazhunt.animatronics.description.foxy=Sa grande mobilité lui permet de rattraper n'importe quelle proie. \n\nCAPACITÉ : "Charge" augmente sa vitesse pendant 3s. Percuter un obstacle prolonge l'effet et permet à Foxy d'attaquer avec son crochet au premier impact.
fazhunt.animatronics.description.endo=Le plus lent, mais le plus robuste de tous. \n\nCAPACITÉ : "Poigne d'acier" lui permet de saisir un joueur. Sa force de projection est augmentée, idéal pour projeter ses victimes dans le vide.
fazhunt.animatronics.description.sfreddy=Nul ne sait quand il est là... \n\nCAPACITÉ : "Submersion" le rend invisible et lui permet de voler à travers les murs. Parfait pour anticiper les trajectoires et bloquer les issues.
fazhunt.animatronics.description.clown=Il ignore comment il a atterri ici, et encore plus pourquoi il porte ce costume. \n\nAu lieu de tuer instantanément, il utilise un marteau. Il gagne de la vitesse en sautant pour poursuivre ses victimes.

fazhunt.animatronics.description.springtrap=Silencieux et impitoyable, il ne laisse que peu de chances de survie. \n\nCAPACITÉ : "Invocation" appelle son compagnon Plushtrap en renfort temporaire. \n\nPASSIF : "Obsession" se charge durant la poursuite. À son maximum, Springtrap gagne un boost de vitesse et révèle le survivant qu'il a le plus traqué.

fazhunt.animatronics.description.gfreddy=Une âme tourmentée piégée dans une carcasse dorée, agissant comme un spectre. \n\nChoisissez une victime pour la hanter en apparaissant soudainement derrière elle ou au coin des murs. \n\nBUT DE LA VICTIME : Trouver toutes les peluches éparpillées pour briser la malédiction et ne plus être hantée.

fazhunt.animatronics.description.mangle=Le danger peut venir de n'importe quel angle. \n\nCAPACITÉ : "Bond" permet de se projeter d'une surface à une autre (murs, plafonds). Bondir depuis une hauteur inflige d'énormes dégâts.
fazhunt.animatronics.description.tchica=Personnage de soutien pur. \n\nCAPACITÉ PRINCIPALE : « Emprise » permet de saisir un survivant à proximité, après quoi son niveau d'« Obsession » commence à augmenter. \n\nIl y a 3 niveaux d'Obsession au total. Pour chaque survivant au niveau maximum, l'équipe des animatroniques reçoit des bonus : \n- 1 Obsédé : Toute l'équipe des animatroniques gagne un boost de vitesse de 5 % pendant 5 secondes ; l'effet se répète toutes les 5 secondes après la fin du précédent. \n- 2 Obsédés : La durée d'immobilisation après une chute est réduite de 20 % pour les animatroniques. \n- 3 Obsédés : Les survivants proches de chaque cible obsédée sont régulièrement révélés à Toy Chica ; Toy Chica obtient la capacité de courir. \n\nImpossible de courir avant d'avoir accumulé 3 survivants obsédés au maximum. Peut attaquer les joueurs obsédés.