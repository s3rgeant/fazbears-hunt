fazhunt.animatronics.description.freddy=Posiada zdolność rozpoznawania graczy, którzy ukrywają się w jednym miejscu i są bezczynni. \n\nGŁÓWNA UMIEJĘTNOŚĆ: \"Ślepa Wściekłość\" pozwala Fredd'emu schwytać graczy, którzy są bezczynni lub się ukrywają. Po skutecznym naaccumulowaniu wściekłości, ofiara zostaje podświetlona dla Freddiego, a jego prędkość wielokrotnie wzrasta. Freddy nie może łapać innych graczy, dopóki nie poradzi sobie z ofiarą.

fazhunt.animatronics.description.bonny=Straciwszy niegdyś twarz, zyskał zdolność widzenia cudzymi oczami. \n\nGŁÓWNA UMIEJĘTNOŚĆ: \"Cudze Spojrzenie\" pozwala Bonniemu zobaczyć otoczenie losowej ofiary z jej perspektywy po użyciu umiejętności.

fazhunt.animatronics.description.chica=Dawna dostawczyni jedzenia, teraz dostarcza bólu. \n\nGŁÓWNA UMIEJĘTNOŚĆ: \"Babeczkowa Mina\" pozwala Chice rozstawiać babeczki po mapie. Babeczki ujawniają pozycję graczy, którzy obok nich przebiegli, a także spowalniają ich na krótki czas.

fazhunt.animatronics.description.foxy=Wysoka mobilność pozwala mu z łatwością doganiać ofiary. \n\nGŁÓWNA UMIEJĘTNOŚĆ: \"Szarża\" przyspiesza Foxy'ego na 3 sekundy. Aby przedłużyć Szarżę, należy w ciągu tych 3 sekund uderzyć w jakąkolwiek przeszkodę. Po pierwszym zderzeniu ze ścianą, Foxy może zadać obrażenia ofierze za pomocą swojego haka.

fazhunt.animatronics.description.endo=Najwolniejszy ze wszystkich, ale najsilniejszy. \n\nGŁÓWNA UMIEJĘTNOŚĆ: \"Stalowy Chwyt\" pozwala schwytać gracza, aby się nad nim znęcać. Siła rzucania rekwizytami przez Endoszkielet jest zwiększona, co pozwala strącać cele z wysokości.

fazhunt.animatronics.description.sfreddy=Nikt nie wie, kiedy jest w pobliżu. \n\nGŁÓWNA UMIEJĘTNOŚĆ: \"Rozproszenie\" czyni Shadow Freddi niewidzialnym i daje mu zdolność latania przez ściany. Doskonale sprawdza się do blokowania przejść i przechytrzania ofiar poprzez przewidywanie ich trasy.

fazhunt.animatronics.description.clown=Nie wie, jak się tu znalazł, a tym bardziej, dlaczego jest tak ubrany. \n\nZamiast natychmiastowego zabijania, posiada młot, którym może atakować ofiary. Aby skutecznie gonić ofiary, rozwija prędkość w skoku.

fazhunt.animatronics.description.springtrap=Cichy podczas chodzenia i praktycznie nie daje szans na ucieczkę. \n\nGŁÓWNA UMIEJĘTNOŚĆ: \"Przywołanie\" pozwala Springtrap'owi przyzwać swojego kompana - Plusztrap'a na pewien okres czasu. \n\nUMIEJĘTNOŚĆ BIERNA: \"Wściekłość\" accumuluje się, gdy Springtrap aktywnie goni graczy. Gdy wartość \"Wściekłości\" osiągnie limit, Springtrap otrzymuje przyspieszenie i podświetlenie ocalałego, za którym gonił najdłużej.

fazhunt.animatronics.description.gfreddy=Dziecięcy męczennik, uwięziony w złotym kostiumie animatronika, ukazuje się ofiarom jako duch. \n\nZnajdź dowolnego ocalałego, a następnie wybierz go jako ofiarę. Twoim zadaniem będzie straszenie ofiary, pojawianie się niespodziewanie za rogami lub za plecami ofiary. \n\nZadaniem ofiary będzie znalezienie wszystkich pluszowych zabawek rozrzuconych w pobliżu. Jeśli ofiera zbierze wszystkie zabawki, przestanie być twoją ofiarą.

fazhunt.animatronics.description.mangle=Za każdym rogiem może czyhać niebezpieczeństwo. \n\nGŁÓWNA UMIEJĘTNOŚĆ: \"Wypad\" pozwala Mangle odepchnąć się od aktualnej powierzchni i przyczepić do nowej. Używając \"Wypadu\" od ściany lub sufitu, można zadać ocalałemu duże obrażenia.

fazhunt.animatronics.description.tchica=Pełni rolę postaci wspierającej. \n\nPODSTAWOWA UMIEJĘTNOŚĆ: \"Chwyt\" pozwala schwytać ocalałego w pobliżu, po czym u ocalałego zacznie rosnąć poziom \"Opętania\". \n\nŁącznie są 3 poziomy opętania. Za każdego ocalałego z maksymalnym poziomem, drużyna animatroników otrzymuje wzmocnienia: \n- 1 Opętany: Cała drużyna animatroników otrzymuje 5% przyspieszenia prędkości biegu na 5 sekund, po zakończeniu działania efekt powtarza się po 5 sekundach.\n- 2 Opętanych: Zmniejszenie działania unieruchomienia po upadku animatroników o 20%\n- 3 Opętanych:  W pobliżu wszystkich opętanych, w pewnych odstępach czasu, podświetlani są ocalali znajdujący się niedaleko nich dla Toy Chiki; Toy Chica zyskuje możliwość biegania.\n\nNie może biegać do czasu, aż nie zdobędzie pełnych 3 opętanych ocalałych. Umie atakować opętanych graczy.