fazhunt.animatronics.description.freddy=Besitzt die Fähigkeit, unkontrollierbare Wut gegenüber Spielern zu empfinden, die campen oder untätig sind. \n\nHAUPTFÄHIGKEIT: "Blinde Wut" ermöglicht es ihm, Spieler aufzuspüren, die sich verstecken oder sich nicht bewegen. Sobald genug Wut angesammelt wurde, wird das Opfer für Freddy hervorgehoben, und seine Geschwindigkeit steigt drastisch an. Freddy kann keine anderen Spieler verfolgen, bis er sein aktuelles Ziel erledigt hat.
fazhunt.animatronics.description.bonnie=Nachdem er sein Gesicht verloren hat, erlangte er die Fähigkeit, durch die anderer zu sehen. \n\nHAUPTFÄHIGKEIT: "Dein ist Mein" ermöglicht es Bonnie, die Kontrolle über ein Ziel zu übernehmen, das sich gerade in seinem Blickfeld befindet; andernfalls wird ein zufälliger Spieler gewählt.
fazhunt.animatronics.description.chica=Ehemalige Liefermitarbeiterin, liefert jetzt Schmerz. \n\nHAUPTFÄHIGKEIT: "Mine" ermöglicht es Chica, Cupcakes auf der Karte zu platzieren. Diese Cupcakes verraten die Position vorbeikommender Spieler und verlangsamen sie kurzzeitig.
fazhunt.animatronics.description.foxy=Hohe Beweglichkeit macht es einfach, zu Opfern aufzuschließen. \n\nHAUPTFÄHIGKEIT: "Ansturm" beschleunigt Foxy für 3 Sekunden. Um den Ansturm zu verlängern, muss er innerhalb dieser Zeit ein Hindernis treffen. Nach dem ersten Wandkontakt kann Foxy das Opfer mit seinem Haken verletzen.
fazhunt.animatronics.description.endo=Der Langsamste von allen, aber auch der Stärkste. \n\nHAUPTFÄHIGKEIT: "Stahlgriff" ermöglicht es ihm, einen Spieler zu packen und mit ihm zu spielen. Seine Wurfkraft für Props wird erhöht, wodurch er Opfer von hohen Vorsprüngen stoßen kann.
fazhunt.animatronics.description.sfreddy=Niemand weiß, wann er in der Nähe ist. \n\nHAUPTFÄHIGKEIT: "Untertauchen" macht Shadow Freddy unsichtbar und verleiht ihm die Fähigkeit, durch Wände zu fliegen. Perfekt, um Wege zu blockieren und Opfer auszuspielen, indem man ihre Routen voraussieht.
fazhunt.animatronics.description.clown=Er weiß nicht, wie er hierher gekommen ist, und noch weniger, warum er so angezogen ist. \n\nAnstatt sofort zu töten, greift er Opfer mit einem Hammer an. Um sie effektiv zu verfolgen, erhält er beim Springen einen Geschwindigkeitsschub.

fazhunt.animatronics.description.springtrap=Lautlos beim Gehen und hinterlässt fast nie eine Chance zu entkommen. \n\nHAUPTFÄHIGKEIT: "Beschwören" ermöglicht es Springtrap, seinen Begleiter – Plushtrap – für eine bestimmte Zeit herbeizurufen. \n\nPASSIVE FÄHIGKEIT: "Obsession" baut sich auf, während Springtrap aktiv Spieler verfolgt. Wenn die "Obsession"-Leiste ihr Limit erreicht, erhält Springtrap einen Geschwindigkeitsschub und das hervorgehobene Opfer, das er am meisten verfolgt hat.

fazhunt.animatronics.description.gfreddy=Ein Kindermärtyrer, gefangen in einem goldenen Animatronic-Kostüm, erscheint den Opfern als Geist. \n\nFinde einen beliebigen Überlebenden und wähle ihn als dein Opfer. Deine Aufgabe ist es, das Opfer zu erschrecken, indem du plötzlich um Ecken oder direkt hinter ihm auftauchst. \n\nDas Ziel des Opfers ist es, alle in der Nähe verstreuten Plüschtiere zu finden. Wenn das Opfer alle Plüschtiere gesammelt hat, ist es nicht mehr dein Opfer.

fazhunt.animatronics.description.mangle=Es könnte nicht sicher sein, um jede Ecke. \n\nHAUPTFÄHIGKEIT: "Sprung" ermöglicht es Mangle, von der aktuellen Oberfläche abzuspringen und sich an einer neuen festzuhalten. Ein "Sprung" von einer Wand oder Decke kann einem Überlebenden großen Schaden zufügen.
fazhunt.animatronics.description.tchica=Vollständig unterstützender Charakter.\n\nHAUPTFÄHIGKEIT: "Festhalten" ermöglicht es, einen nahen Überlebenden zu greifen, woraufhin der "Obsession"-Level des Überlebenden zu steigen beginnt.\n\nEs gibt insgesamt 3 Obsession-Level. Für jeden Überlebenden auf dem maximalen Level erhält das Animatronic-Team Buffs: \n- 1 Fixierter: Das gesamte Animatronic-Team erhält für 5 Sekunden einen 5%igen Bewegungsgeschwindigkeitsschub; nach Ablauf des Effekts wiederholt er sich nach 5 Sekunden. \n- 2 Fixierte: Die Dauer der Bewegungsunfähigkeit nach dem Fallen der Animatronics wird um 20% reduziert. \n- 3 Fixierte: In der Nähe aller fixierten Überlebenden werden in bestimmten Abständen umstehende Überlebende für Toy Chica hervorgehoben; Toy Chica erhält die Fähigkeit zu rennen.\n\nKann nicht rennen, bis 3 fixierte Überlebende angesammelt wurden. Kann fixierte Spieler angreifen.