fazhunt.animatronics.description.freddy=Posee la habilidad de sentir una rabia incontrolable hacia jugadores que esten campeando o inactivos. \n\nHABILIDAD: "Furia Ciega" le permite atrapar jugadores que esten escondidos o quietos. Una vez que la rabia este acumulada, la victima es resaltada para Freddy, y su velocidad aumenta drasticamente. Freddy no puede perseguir otros jugadores hasta encargarse de su objetivo.
fazhunt.animatronics.description.bonnie=Al perder su rostro, gano la habilidad de ver a traves del de los demas. \n\nHABILIDAD: "Vision Prestada" le permite a Bonnie controlar a un objetivo que este en su rango de vision; de lo contrario, un jugador aleatorio es seleccionado.
fazhunt.animatronics.description.chica=Una antigua repartidora de comida, ahora reparte dolor. \n\nHABILIDAD: "Mina" permite a Chica colocar cupcakes por el mapa. estos cupcakes revelan la posicion de jugadores cercanos y los ralentiza temporalmente.
fazhunt.animatronics.description.foxy=Alta movilidad que le permite atrapar facilmente a sus victimas. \n\nHABILIDAD: "Carga" acelera a Foxy por 3 segundos. Para extender su Carga, debe chocar contra un obstaculo durante ese tiempo. Luego del primer impacto contra una pared, Foxy podra dañar a su victima con su garfio.
fazhunt.animatronics.description.endo=El mas lento de todos, pero el mas fuerte. \n\nHABILIDAD: "Agarre Metalico" le permite agarrar un jugador y jugar con el. Su fuerza al lanzar es aumentada, permitiendole tirar jugadores desde gran altura.
fazhunt.animatronics.description.sfreddy=Nadie sabe cuando esta cerca. \n\nHABILIDAD: "Sumergir" vuelve a Shadow Freddy invisible y le otorga la habilidad de atravesar paredes. Perfecto para bloquear caminos y predecir el movimiento de los jugadores.
fazhunt.animatronics.description.clown=El no sabe como llego aqui, ni por que esta vestido de esta forma. \n\nEn lugar de matar al instante, el porta un martillo para atacar a los jugadores. Para perseguirlos mejor, gana velocidad cuando salta.

fazhunt.animatronics.description.springtrap=Silencioso cuando camina, y casi nunca deja una chance para escapar de el. \n\nHABILIDAD: "Invocar" permite a Springtrap llamar a su compañero – Plushtrap – por un cierto periodo de tiempo. \n\nPASIVA: La "Obsesion" aumenta mientras Springtrap persigue jugadores. Cuando su medidor de "Obsesion" llega al limite, Springtrap gana una mejora de velocidad y resalta al superviviente que mas persiguio.

fazhunt.animatronics.description.gfreddy=Un pequeño martir, atrapado dentro de un animatronico dorado, aparece ante sus victimas como un fantasma. \n\nEncuentra un superviviente y escogelo como tu victima. Tu trabajo es aterrorizar a la victima, apareciendo desde esquinas o detras de el. \n\nEl objetivo de la victima es encontrar todos los peluches repartidos por el mapa. Si la victima encuentra todos los peluches, ya no podras atacarlo.

fazhunt.animatronics.description.mangle=Puede que ningun rincon sea seguro. \n\nHABILIDAD: "Embestida" le permite a Mangle saltar de la superficie actual y pegarse a otra. Usando "Embestida" desde una pared o techo puede provocar mucho daño a un superviviente.
fazhunt.animatronics.description.tchica=Personaje de soporte.\n\nHABILIDAD: “Mantener” le permite agarrar un superviviente cercano, provocando que el nivel de “Obsesion” del survivor aumente.\n\nHay 3 niveles de Obsesion. Por cada superviviente con nivel maximo, el equipo animatronico recibe mejoras: \n- 1 Obsesionado: Todo el equipo animatronico gana 5% de aumento de velocidad por 5 segundos; cuando el efecto termina, se repite cada 5 segundos. \n- 2 Obsesionados: La penalizacion de movimiento cuando un animatronico salta hacia el suelo se reduce un 20%. \n- 3 Obsesionados: Estando cerca de los supervivientes obsesionados, cada cierto tiempo, estos son resaltados por Toy Chica; Toy Chica gana la habilidad de correr.\n\nNo puede correr hasta que hayan 3 obsesionados completos. Solo puede atacar jugadores obsesionados.