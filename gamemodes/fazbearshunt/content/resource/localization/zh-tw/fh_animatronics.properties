fazhunt.animatronics.description.freddy=擁有對蹲守或閒置玩家感到無法控制的憤怒的能力。\n\n主要能力："盲目暴怒"讓他能抓住躲藏或不動的玩家。積累足夠怒氣後，受害者會被高亮顯示給弗萊迪，並且他的速度大幅提升。弗萊迪在對付當前目標前無法追擊其他玩家。
fazhunt.animatronics.description.bonnie=曾失去面部，從而獲得了看透他人內心的能力。\n\n主要能力："你的就是我的"允許邦尼控制當前視線內的目標；否則隨機選擇一名玩家。
fazhunt.animatronics.description.chica=前外送員，現在專送痛苦。\n\n主要能力："地雷"允許奇卡在地圖上放置蛋糕。這些蛋糕會暴露經過玩家的位置並短暫減慢其速度。
fazhunt.animatronics.description.foxy=高機動性使其易於追上受害者。\n\n主要能力："衝鋒"使狐狸加速3秒。要延長衝鋒時間，他必須在該時間內撞擊任何障礙物。首次撞擊牆壁後，狐狸能用鉤子傷害受害者。
fazhunt.animatronics.description.endo=速度最慢，但力量最強。\n\n主要能力："鋼鐵之握"允許他抓住玩家並戲弄他們。他投擲道具的力量增強，能將受害者從高處擊落。
fazhunt.animatronics.description.sfreddy=無人知曉他何時在附近。\n\n主要能力："潛入"使暗影弗萊迪隱形並賦予他穿牆飛行的能力。完美用於封鎖路徑和通過預測路線智取受害者。
fazhunt.animatronics.description.clown=他不知道為何在此，更不知為何如此打扮。\n\n不使用即死攻擊，而是用錘子攻擊受害者。為有效追擊，他在跳躍時獲得加速。
fazhunt.animatronics.description.springtrap=行走無聲，幾乎從不留逃生機會。\n\n主要能力："召喚"允許彈簧陷阱召喚同伴——小兔陷阱——持續一段時間。\n\n被動能力："執念"在彈簧陷阱積極追擊玩家時積累。當"執念"計量表達到上限，彈簧陷阱獲得加速並高亮顯示他追擊最多的倖存者。
fazhunt.animatronics.description.gfreddy=一個殉道兒童，被困於金色電子玩偶套裝內，以鬼魂形態出現在受害者面前。\n\n找到任意倖存者並選擇其為受害者。你的任務是嚇唬受害者，突然出現在拐角或身後。\n\n受害者的目標是找到附近散落的所有絨毛玩具。若受害者收集全部玩具，他們將不再是你的目標。
fazhunt.animatronics.description.mangle=每個角落可能都不安全。\n\n主要能力："猛撲"允許蔓果從當前表面躍起並附著到新表面。從牆壁或天花板使用"猛撲"可對倖存者造成大量傷害。
fazhunt.animatronics.description.tchica=完全輔助型角色。\n\n主要能力："挾持"允許抓住附近倖存者，隨後該倖存者的"執念"等級開始提升。\n\n共有3個執念等級。每有一個達到最大等級的倖存者，電子玩偶團隊獲得增益：\n- 1個執念者：全隊獲得5%移動速度提升，持續5秒；效果結束後，5秒後重複。\n- 2個執念者：電子玩偶倒地後的僵直時間減少20%。\n- 3個執念者：所有被執念倖存者附近，定期高亮附近倖存者給玩具奇卡；玩具奇卡獲得奔跑能力。\n\n在累積滿3個被執念倖存者前無法奔跑。可攻擊被執念玩家。