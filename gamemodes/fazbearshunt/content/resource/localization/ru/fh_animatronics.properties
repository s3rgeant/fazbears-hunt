fazhunt.animatronics.description.freddy=Обладает способностью испытывать неодолимый гнев к игрокам, которые засели где-нибудь и бездействуют. \n\nОСНОВНАЯ СПОСОБНОСТЬ: "Слепая Ярость" позволяет ловить игроков которые бездействуют или прячутся. Успешно накопив гнев, жертва просвечивается Фредди, а его скорость увеличивается в разы. Фредди не сможет ловить других игроков, пока не избавится от жертвы.
fazhunt.animatronics.description.bonnie=Потеряв однажды лицо, получил способность смотреть чужими. \n\nОСНОВНАЯ СПОСОБНОСТЬ: "Чужим Разумом" позволяет Бонни взять под контроль цель которая находится под прицелом, в противном случае, случайного игрока.
fazhunt.animatronics.description.chica=Бывшая доставщица еды, теперь доставляет боль. \n\nОСНОВНАЯ СПОСОБНОСТЬ: "Мина" позволяет Чике ставить кексы по карте. Кексы выдают позицию пробегавших мимо них игроков, а также замедляют их на малый промежуток времени.
fazhunt.animatronics.description.foxy=Высокая мобильность позволяет легко догонять жертв. \n\nОСНОВНАЯ СПОСОБНОСТЬ: "Рывок" ускоряет Фокси на 3 секунды. Чтобы продлить Рывок, нужно в течении этих 3 секунд ударится об любое препятствие. После первого удара об стену, Фокси может нанести урон жертве с помощью своего крюка.
fazhunt.animatronics.description.endo=А мы точно никого не забыли? \n\nОСНОВНАЯ СПОСОБНОСТЬ: "Притворство" позволяет Эндоскелету повзаимствовать способность другого аниматроника на некоторое время. \nЭндоскелет не может притворится одним и тем же аниматроником дважды; притвориться своим союзником; притворится аниматрониками у которых свой специальный раунд; притвориться Золотым Фредди.
fazhunt.animatronics.description.sfreddy=Никто не знает, если он находится рядом. \n\nОСНОВНАЯ СПОСОБНОСТЬ: "Рассеяться" делает Шедоу Фредди невидимым, и тот получает способность полёта сквозь стены. Отлично работает чтобы закрывать проходы и обыгрывать жертв, предсказывая их маршрут.
fazhunt.animatronics.description.clown=Он не знает как оказался тут, и тем более, не знает почему так одет. \n\nВместо мгновенного убийства, имеет молот, которым может атаковать жертв. Каждый удар отталкивает Клоуна назад, позволяя развивать скорость ударами сзади себя.

fazhunt.animatronics.description.springtrap=Бесшумен при ходьбе, и практически никогда не оставляет шанса убежать от него. \n\nОСНОВНАЯ СПОСОБНОСТЬ: "Призыв" позволяет Спрингтрапу призвать своего компаньона - Плюштрапа на какой-то период времени. \n\nПАССИВНАЯ СПОСОБНОСТЬ: "Одержимость" накапливается когда Спрингтрап активно гоняется за игроками, когда значение "Одержимости" достигает предела, Спрингтрап получает ускорение и просвет на выжившего, за которым бегал больше всего.

fazhunt.animatronics.description.gfreddy=Ребёнок-мученик, запертый в золотом костюме аниматроника, является перед жертвами в виде призрака. \n\nНайдите любого выжившего, а затем выберите его в качестве жертвы. Вашей задачей будет пугать жертву, неожиданно появляться за углами или у жертвы за спиной. \n\nЗадачей жертвы будет найти все плюшевые игрушки, разбросаные неподалёку. Если жертва соберёт все игрушки, она перестанет являться вашей жертвой.

fazhunt.animatronics.description.mangle=За каждым углом может быть не безопасно. \n\nОСНОВНАЯ СПОСОБНОСТЬ: "Выпад" позволяет Мангл откинуться от текущей поверхности и прицепиться к новой. Используя "Выпад" от стены или потолка, можно нанести большое количество урона выжившему.
fazhunt.animatronics.description.tchica=Полностью саппортивный персонаж. \n\nОСНОВНАЯ СПОСОБНОСТЬ: "Удержание" позволяет схватить выжившего вблизи, после чего у выжившего начнёт подниматься уровень "Одержимости". \n\nВсего 3 уровня одержимости. За каждого выжившего с максимальным уровнем, команде аниматроников даются баффы: \n- 1 Одержимый: Вся команда аниматроников получает ускорение скорости бега на 5% на 5 секунд, после окончания действия эффекта он повторяется через 5 секунд.\n- 2 Одержимых: Снижение действия неподвижности после падения аниматроников на 20%; Той Чика получает возможность бега.\n- 3 Одержимых:  Рядом со всеми одержимыми, каждые несколько секунд, подсвечиваются выжившие всем аниматроникам.\n\nНе умеет бегать до тех пор, пока не наберёт полностью 2 одержимых выживших. Умеет атаковать одержимых игроков.

fazhunt.animatronics.description.scrapbaby=Убегать становится сложнее. \n\nОСНОВНАЯ СПОСОБНОСТЬ: "Стырить" позволяет Скрап Бейби хватать выживших на расстоянии, используя свой крюк. \nПока выживший тянется крюком к Скрап Бейби, он будет получать пассивный урон, а как только выживший достигает Скрап Бейби - она бьёт его, нанося урон, отпуская выжившего и просвечивая его на какое-то время всем аниматроникам.